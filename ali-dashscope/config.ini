[API]
api_key = sk-xxx
app_id = 519c7167d9084c1cbe9127cdea27c892

[MODE]
# 运行模式: application (应用模式,需要智能体应用Id) 或 generation (通用模型模式)
# 默认: application
mode = application

[MODEL]
# LLM 模型名称 (generation 模式使用)
# 可选: deepseek-v3.2-exp, deepseek-v3.1, deepseek-v3, deepseek-r1
# 默认: deepseek-v3.2-exp
model = deepseek-v3.2-exp

[THINKING]
# 是否启用思考模式 (generation 模式使用，仅部分模型支持)
# 可选: true, false
# 默认: false
enable_thinking = false